# Admin uploads (blogs/gallery/trips) persist on a Railway Volume.
# Dashboard: add Volume → mount path exactly: /app/public/uploads
# Railway then sets RAILWAY_VOLUME_MOUNT_PATH automatically.

[build]
builder = "NIXPACKS"
buildCommand = "npm run vercel-build"

[deploy]
startCommand = "npx next start -H 0.0.0.0 -p 3000"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
